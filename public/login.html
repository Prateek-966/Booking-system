<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest sign in — Staylist</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-portal="guest">
  <header class="site-header">
    <a class="brand" href="/">Staylist</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <p id="message" role="alert" hidden></p>

    <div class="card">
      <p class="portal-tag">Guest account</p>
      <h1 id="auth-title">Sign in to book</h1>

      <section id="google-signin" hidden aria-label="Google sign-in">
        <div id="google-button"></div>
        <form id="google-confirm" hidden>
          <p id="google-instructions" class="hint"></p>
          <label id="google-password-row" hidden>Existing account password
            <input type="password" id="google-password" maxlength="72" autocomplete="current-password">
          </label>
          <div id="google-factor-row" hidden>
            <label>Authenticator code
              <input type="text" id="google-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
            </label>
            <label>Or a recovery code
              <input type="text" id="google-recovery" maxlength="14" autocomplete="off" placeholder="XXXX-XXXX-XXXX">
            </label>
          </div>
          <button type="submit" id="google-submit">Continue with Google</button>
        </form>
        <p class="hint">Or sign in with your password below.</p>
      </section>

      <form id="auth-form">
        <label id="name-row" hidden>Name<input type="text" id="name" maxlength="100" autocomplete="name"></label>
        <label>Email<input type="email" id="email" required maxlength="254" autocomplete="email"></label>
        <label id="phone-row" hidden>Phone (optional)
          <input type="tel" id="phone" maxlength="20" autocomplete="tel">
        </label>
        <label>Password<input type="password" id="password" required minlength="8" maxlength="72" autocomplete="current-password"></label>
        <button type="submit" id="submit">Sign in</button>
      </form>

      <p class="switch">
        <span id="toggle-text">New here?</span>
        <button type="button" id="toggle" class="link-btn">Create a guest account</button>
      </p>
      <p class="switch hint">Are you the owner? <a href="/owner-login.html">Owner sign in</a>.</p>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
  <script type="module" src="/js/google-login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner sign in — Staylist</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-portal="owner">
  <header class="site-header">
    <a class="brand" href="/">Staylist</a>
    <nav id="nav"></nav>
  </header>

  <main class="narrow">
    <p id="message" role="alert" hidden></p>

    <div class="card">
      <p class="portal-tag owner">Owner account</p>
      <h1 id="auth-title">Owner sign in</h1>

      <section id="google-signin" hidden aria-label="Google sign-in">
        <div id="google-button"></div>
        <form id="google-confirm" hidden>
          <p id="google-instructions" class="hint"></p>
          <label id="google-password-row" hidden>Existing account password
            <input type="password" id="google-password" maxlength="72" autocomplete="current-password">
          </label>
          <div id="google-factor-row" hidden>
            <label>Authenticator code
              <input type="text" id="google-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
            </label>
            <label>Or a recovery code
              <input type="text" id="google-recovery" maxlength="14" autocomplete="off" placeholder="XXXX-XXXX-XXXX">
            </label>
          </div>
          <button type="submit" id="google-submit">Continue with Google</button>
        </form>
        <p class="hint">Or sign in with your password below.</p>
      </section>

      <form id="auth-form">
        <label>Email<input type="email" id="email" required maxlength="254" autocomplete="username"></label>
        <label>Password<input type="password" id="password" required maxlength="72" autocomplete="current-password"></label>

        <div id="totp-row" hidden>
          <label>Authenticator code
            <input type="text" id="totpCode" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="6" pattern="[0-9]{6}" placeholder="123456">
          </label>
          <p class="hint">
            Lost your phone?
            <button type="button" id="use-recovery" class="link-btn">Use a recovery code</button>
          </p>
          <label id="recovery-row" hidden>Recovery code
            <input type="text" id="recoveryCode" maxlength="14" placeholder="XXXX-XXXX-XXXX">
          </label>
        </div>

        <button type="submit" id="submit">Sign in</button>
      </form>

      <p class="switch hint">
        There is one owner account and it is created on the server, so there is no sign-up here.
        Run <code>npm run create-owner</code> to create or reset it.
      </p>
      <p class="switch hint">Looking to book a room? <a href="/login.html">Guest sign in</a>.</p>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
  <script type="module" src="/js/google-login.js"></script>
</body>
</html>

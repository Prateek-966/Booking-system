services:
  - type: web
    name: booking-system
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    # A dedicated endpoint, so renaming a product route can never break the
    # deploy gate. If this service was created with an older blueprint, update
    # Settings -> Health Check Path by hand: Render does not always re-sync it.
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      # The owner account is provisioned from these at startup (no shell
      # needed). sync: false makes Render prompt for the values securely at
      # deploy time instead of storing them in the repository.
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Note: on the free plan the filesystem is ephemeral, so the SQLite
      # database resets on each deploy/restart (the owner account is
      # recreated automatically from the variables above). Attach a
      # persistent disk (paid plans) mounted at /data and set DATA_DIR=/data
      # to keep rooms, photos and bookings permanently.
